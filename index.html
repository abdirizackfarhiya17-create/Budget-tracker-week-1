<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Budget & Expense Tracker</title>
    <!-- Part 4.1: Linking the external stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Part 1: Page structure header -->
    <header id="main-header">
        <h1>My Budget Tracker</h1>
        <p>Track your income and expenses in one place.</p>
    </header>

    <main class="container">
        
        <!-- Part 2: The "Add Expense" section -->
        <section id="add-expense-section" class="content-box">
            <h2>Add Expense</h2>
            
            <div class="form-group">
                <label for="expense-name">Expense Name:</label>
                <input type="text" id="expense-name" placeholder="e.g., Groceries">
            </div>
            
            <div class="form-group">
                <label for="expense-amount">Amount ($):</label>
                <input type="number" id="expense-amount" placeholder="0.00" min="0" step="0.01">
            </div>
            
            <div class="form-group">
                <label for="expense-category">Category:</label>
                <select id="expense-category">
                    <option value="">-- Choose a Category --</option>
                    <option value="food">Food & Dining</option>
                    <option value="rent">Rent & Housing</option>
                    <option value="utilities">Utilities</option>
                    <option value="entertainment">Entertainment</option>
                </select>
            </div>

            <button type="button" id="submit-btn">Add Expense</button>
        </section>

        <!-- Part 3: The "Your Expenses" placeholder -->
        <section id="expenses-display-section" class="content-box">
            <h2>Your Expenses</h2>
            <p class="placeholder-text">No expenses yet</p>
        </section>

    </main>

</body>
</html>
